name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint e formatacao
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check
      # Duas versoes da mesma dependencia na arvore e como fixture e codigo
      # de producao passam a discordar silenciosamente.
      - run: pnpm dedupe --check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: Testes unitarios
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - run: pnpm test
      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        if: always()
        with:
          name: coverage
          path: '**/coverage/**'
          retention-days: 7

  integration:
    name: Testes de integracao (Redis real)
    runs-on: ubuntu-latest
    permissions: { contents: read }
    services:
      # Redis de verdade, e nao um dobro: o BullMQ depende de comandos
      # bloqueantes, filas com atraso e scripts Lua, e um mock erraria
      # exatamente a semantica que queremos provar.
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - run: pnpm test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - run: pnpm build

      # A spec e DERIVADA das rotas do Nest e dos schemas Zod, e fica
      # commitada para ser revisavel no diff — "este PR mudou a forma de
      # `SendPix`" e exatamente a linha que um revisor precisa ver. O gerador
      # tambem FALHA quando uma rota `/v1` nova nao tem contrato declarado,
      # entao a spec nao fica em dia por acidente.
      - run: pnpm gen:openapi
      - name: A spec commitada esta em dia
        run: git diff --exit-code docs/openapi.json
