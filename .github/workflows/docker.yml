name: Imagens

on:
  workflow_dispatch:
  pull_request:
    paths: ['docker/**', 'apps/**', 'packages/**', 'pnpm-lock.yaml', '.github/workflows/docker.yml']
  push:
    branches: [main]
    tags: ['v*']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.componente }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # O upload do SARIF do trivy escreve no Code Scanning. Sem isto o passo
      # avisa "missing security-events permission" e o relatorio some.
      security-events: write
      # OIDC para o cosign keyless: e o que permite assinar sem chave privada
      # de longa duracao guardada em secret — que seria a coisa mais valiosa
      # do repositorio para roubar.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        componente: [api, worker, web, mock-bank, migrate]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Metadados da imagem
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.componente }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar
        id: build
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          file: docker/${{ matrix.componente }}.Dockerfile
          # `arm64` so em TAG. Construir duas arquiteturas em todo push para
          # `main` triplica o tempo de CI por um artefato que so o release
          # usa — e o build cruzado com QEMU e a parte lenta.
          platforms: ${{ startsWith(github.ref, 'refs/tags/') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.componente }}
          cache-to: type=gha,mode=max,scope=${{ matrix.componente }}
          provenance: true
          sbom: true

      # Trivy pela IMAGEM, e nao pela action.
      #
      # `aquasecurity/trivy-action`, mesmo fixada por SHA, depende
      # internamente de `aquasecurity/setup-trivy@v0.2.2` — uma tag FLUTUANTE
      # que o autor moveu. Quando ela sumiu, os cinco jobs falharam ANTES de
      # construir qualquer imagem: o pin por SHA nao protege contra o que a
      # action resolve em tempo de execucao.
      #
      # `docker run` numa tag imutavel nao tem essa camada. E o mesmo padrao
      # que `helm.yml` ja usa para o kubeconform.
      - name: Scan de vulnerabilidades
        env:
          REPOSITORIO: ${{ github.repository }}
          COMPONENTE: ${{ matrix.componente }}
          DIGEST: ${{ steps.build.outputs.digest }}
          NUMERO_PR: ${{ github.event.number }}
          EVENTO: ${{ github.event_name }}
          # O trivy puxa a imagem do GHCR quando ela foi publicada (push);
          # o `docker login` do passo anterior vive no host e nao dentro do
          # container, entao a credencial vai por variavel.
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Referencia OCI e MINUSCULA, sempre.
          #
          # `github.repository` e `TokenOneBR/BaaS-Connector`, com maiusculas.
          # A `metadata-action` normaliza sozinha e as tags publicadas saem
          # certas; esta linha, montada a mao, nao normalizava — e o trivy
          # recusava com "could not parse reference". O gate falhava DEPOIS de
          # a imagem ter sido construida e publicada com sucesso, que e a
          # forma mais confusa possivel de falhar.
          repo_minusculo=$(printf '%s' "$REPOSITORIO" | tr '[:upper:]' '[:lower:]')

          if [ "$EVENTO" = 'pull_request' ]; then
            # Em PR nao ha push: a imagem foi carregada no daemon local
            # (`load: true`), e e de la que o trivy le.
            imagem="${REGISTRY}/${repo_minusculo}-${COMPONENTE}:pr-${NUMERO_PR}"
          else
            imagem="${REGISTRY}/${repo_minusculo}-${COMPONENTE}@${DIGEST}"
          fi
          echo "Analisando $imagem"

          docker run --rm \
            -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/w" -w /w \
            aquasec/trivy:0.58.1 image \
              --format sarif --output "trivy-${COMPONENTE}.sarif" \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              "$imagem"

      # `always()` estava errado: quando o BUILD falha, o trivy nunca roda, o
      # arquivo nao existe, e este passo falhava por cima com "Path does not
      # exist" — escondendo o erro de verdade atras de um segundo erro.
      # O SARIF so existe se o build passou; se o trivy achou vulnerabilidade
      # (exit 1) o arquivo esta la e queremos publica-lo, dai `!cancelled()`.
      - name: Publicar SARIF
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name != 'pull_request' && hashFiles(format('trivy-{0}.sarif', matrix.componente)) != '' }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-${{ matrix.componente }}.sarif
          category: trivy-${{ matrix.componente }}

      - name: Instalar cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Assinar (keyless, OIDC)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Assina o DIGEST, nunca a tag: uma tag pode ser reapontada, e
          # assinar `:latest` produz uma assinatura que nao prova nada sobre o
          # conteudo que alguem realmente baixou.
          #
          # Minusculo pelo mesmo motivo do passo do trivy: o cosign tambem
          # recusa referencia OCI com maiuscula.
          repo_minusculo=$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes "${REGISTRY}/${repo_minusculo}-${{ matrix.componente }}@${DIGEST}"
