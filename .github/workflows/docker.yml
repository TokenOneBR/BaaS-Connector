name: Imagens

on:
  pull_request:
    paths: ['docker/**', 'apps/**', 'packages/**', 'pnpm-lock.yaml', '.github/workflows/docker.yml']
  push:
    branches: [main]
    tags: ['v*']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.componente }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # OIDC para o cosign keyless: e o que permite assinar sem chave privada
      # de longa duracao guardada em secret — que seria a coisa mais valiosa
      # do repositorio para roubar.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        componente: [api, worker, web, mock-bank, migrate]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Metadados da imagem
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.componente }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar
        id: build
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          file: docker/${{ matrix.componente }}.Dockerfile
          # `arm64` so em TAG. Construir duas arquiteturas em todo push para
          # `main` triplica o tempo de CI por um artefato que so o release
          # usa — e o build cruzado com QEMU e a parte lenta.
          platforms: ${{ startsWith(github.ref, 'refs/tags/') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.componente }}
          cache-to: type=gha,mode=max,scope=${{ matrix.componente }}
          provenance: true
          sbom: true

      - name: Scan de vulnerabilidades
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: ${{ github.event_name == 'pull_request' && format('{0}/{1}-{2}:pr-{3}', env.REGISTRY, github.repository, matrix.componente, github.event.number) || format('{0}/{1}-{2}@{3}', env.REGISTRY, github.repository, matrix.componente, steps.build.outputs.digest) }}
          format: sarif
          output: trivy-${{ matrix.componente }}.sarif
          severity: HIGH,CRITICAL
          # `ignore-unfixed`: uma CVE sem correcao disponivel nao e acionavel.
          # Barrar o release por ela ensina a equipe a passar por cima do
          # gate, e ai as que TEM correcao passam junto.
          ignore-unfixed: true
          exit-code: '1'

      - name: Publicar SARIF
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-${{ matrix.componente }}.sarif
          category: trivy-${{ matrix.componente }}

      - name: Instalar cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Assinar (keyless, OIDC)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Assina o DIGEST, nunca a tag: uma tag pode ser reapontada, e
          # assinar `:latest` produz uma assinatura que nao prova nada sobre o
          # conteudo que alguem realmente baixou.
          cosign sign --yes "${REGISTRY}/${{ github.repository }}-${{ matrix.componente }}@${DIGEST}"
