name: OpenSSF Scorecard

# O Scorecard SO analisa o branch PADRAO do repositorio, e recusa qualquer
# outro com "validating options: only default branch is supported".
#
# O padrao deste repositorio ainda e `claude/baas-connector-rzwrze`, entao o
# gatilho por push em `main` falhava em toda entrega — um check vermelho por
# configuracao, nao por qualidade, que e a pior especie porque ensina a
# ignorar o vermelho.
#
# O push fica de fora ate o padrao virar `main`. Os dois gatilhos que
# sobram sao os que a propria OpenSSF recomenda, e o agendado cobre o
# repositorio inteiro toda semana.
on:
  branch_protection_rule:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with: { sarif_file: results.sarif }
