name: Stale

on:
  schedule:
    - cron: '0 8 * * *'

permissions: {}

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions: { issues: write, pull-requests: write }
    steps:
      - uses: actions/stale@28ca1036281a5e5922ead5184a1bbf96e5fc984e # v9.0.0
        with:
          days-before-stale: 60
          days-before-close: 14
          exempt-issue-labels: pinned,security,good first issue,adapter,needs-adr
          exempt-pr-labels: pinned,security
          stale-issue-message: >
            Esta issue esta sem atividade ha 60 dias. Se ainda for relevante,
            comente para mante-la aberta.
          stale-pr-message: >
            Este PR esta sem atividade ha 60 dias. Comente se ainda estiver
            trabalhando nele.
