name: Checks de PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  title:
    name: Titulo em conventional commit
    runs-on: ubuntu-latest
    permissions: { pull-requests: read }
    steps:
      - uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775554c415e1fc1483d9 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            taxonomy
            contracts
            provider-spi
            adapter-kit
            conformance
            ledger
            db
            crypto
            observability
            sdk
            api
            worker
            web
            mock-bank
            adapter-celcoin
            adapter-qitech
            adapter-dock
            adapter-asaas
            adapter-woovi
            adapter-mock-bank
            deploy
            docs
            deps
          requireScope: false

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Verificar Signed-off-by em todos os commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          while read -r sha; do
            if ! git log -1 --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::Commit $sha nao tem Signed-off-by. Use 'git commit -s'."
              missing=1
            fi
          done < <(git rev-list "$BASE".."$HEAD")
          exit $missing

  changeset:
    name: Changeset obrigatorio quando packages/ muda
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.labels.*.name, 'no-changeset')"
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Verificar
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE".."$HEAD")
          if echo "$changed" | grep -qE '^packages/.*/src/'; then
            if ! echo "$changed" | grep -qE '^\.changeset/.*\.md$'; then
              echo "::error::Mudanca em packages/ sem changeset. Rode 'pnpm changeset'."
              echo "Se realmente nao se aplicar, peca a label 'no-changeset'."
              exit 1
            fi
          fi

  cassette-pii:
    name: Fixtures sem dado pessoal
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm exec tsx scripts/check-cassette-pii.ts
