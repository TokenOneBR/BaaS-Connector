name: Varredura de segredos

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }

      # Gitleaks pela IMAGEM, e nao pela action.
      #
      # `gitleaks/gitleaks-action` exige LICENCA PAGA quando o repositorio
      # pertence a uma organizacao — e falha com "missing gitleaks license"
      # antes de varrer um unico commit. Como a organizacao e a TokenOneBR,
      # o gate nunca chegou a rodar: um check de seguranca permanentemente
      # vermelho por um motivo comercial, o que ensina a ignora-lo.
      #
      # O gitleaks em si e MIT e nao pede licenca nenhuma. Rodar o binario
      # direto entrega exatamente a varredura que o gate promete, sem custo
      # e sem a camada de resolucao da action. Mesmo padrao ja usado para o
      # trivy em `docker.yml` e para o kubeconform em `helm.yml`.
      - name: Varrer o historico
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.21.2 \
              detect \
              --source /repo \
              --config /repo/.gitleaks.toml \
              --redact \
              --verbose \
              --exit-code 1
