# Observabilidade, OPT-IN: `pnpm up:observability`.
#
# Arquivo separado de proposito. `docker compose up` para um contribuidor novo
# sao seis containers, nao dez — e a diferenca entre "subiu" e "desistiu" num
# primeiro contato costuma ser essa. Quem precisa de trace pede.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ['--config=/etc/otel/config.yaml']
    volumes: ['./docker/otel/config.yaml:/etc/otel/config.yaml:ro']
    ports: ['4317:4317', '4318:4318']
    depends_on: [jaeger]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports: ['16686:16686']

  prometheus:
    image: prom/prometheus:v3.0.1
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=24h'
    volumes: ['./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro']
    ports: ['9090:9090']

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      # Login anonimo como admin: e uma stack LOCAL de desenvolvimento, e
      # exigir senha aqui so produz a senha `admin/admin` escrita num README.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    # 3030 e nao 3000: o console ja ocupa a 3000, e descobrir isso pelo erro
    # de bind e um comeco ruim de sessao de depuracao.
    ports: ['3030:3000']
    depends_on: [prometheus]

  api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: baas-api

  worker:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: baas-worker
