{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "baas.serviceAccountName" . }}
  labels:
    {{- include "baas.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  # A UNICA coisa que muda entre EKS, GKE e AKS.
  #
  # As credenciais de provedor sao linhas envelope-encrypted no Postgres, com
  # a data key envolvida pelo KMS da nuvem — e a identidade que decifra a data
  # key chega por esta anotacao. E por isso que o mesmo chart roda nas tres
  # nuvens sem nenhum outro ajuste, e por que ele nao guarda segredo de
  # provedor nenhum.
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Nenhum componente fala com a API do Kubernetes. Montar o token de servico
# em todo pod so cria credencial de cluster onde ela nao tem uso.
automountServiceAccountToken: false
{{- end }}
