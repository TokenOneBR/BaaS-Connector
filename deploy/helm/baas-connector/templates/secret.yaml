{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
#
# Os QUATRO (mais o pepper) segredos que vivem no Kubernetes.
#
# Todo o resto do produto — credencial de provedor, segredo de webhook de
# saida, chave de API — e linha cifrada no Postgres. E por isso que este chart
# e pequeno, que adicionar um provedor nao exige redeploy, e que rotacionar
# uma credencial nao e um `helm upgrade`.
#
# `secrets.create` existe para `kind` e demonstracao. Em producao use
# `existingSecret`: valores aqui acabam num `values.yaml` versionado, e um
# `JWT_PRIVATE_KEY` no git e um token de ADMIN forjavel por quem clonar o
# repositorio.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "baas.secretName" . }}
  labels:
    {{- include "baas.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseUrl e obrigatorio quando secrets.create" .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ required "secrets.redisUrl e obrigatorio quando secrets.create" .Values.secrets.redisUrl | quote }}
  JWT_PRIVATE_KEY: {{ required "secrets.jwtPrivateKey e obrigatorio quando secrets.create" .Values.secrets.jwtPrivateKey | quote }}
  JWT_PUBLIC_KEY: {{ required "secrets.jwtPublicKey e obrigatorio quando secrets.create" .Values.secrets.jwtPublicKey | quote }}
  BLIND_INDEX_PEPPER: {{ required "secrets.blindIndexPepper e obrigatorio quando secrets.create" .Values.secrets.blindIndexPepper | quote }}
  {{- if eq .Values.kms.driver "local" }}
  KMS_MASTER_SECRET: {{ required "secrets.kmsMasterSecret e obrigatorio com kms.driver=local" .Values.secrets.kmsMasterSecret | quote }}
  {{- end }}
{{- end }}
